[build.environment]
  # Pin it. Netlify's default Node has moved before and will again, and this
  # code uses top-level await in the function plus native fetch.
  NODE_VERSION = "20"

[build]
  # Stamps the site address into the social tags and generates _headers
  # (with computed CSP hashes), robots.txt and sitemap.xml.
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # src/ lives outside the functions directory, so it has to be named.
  included_files = ["src/**"]

# Function execution time is set by the Netlify plan, not here. The audit's own
# deadline is FETCH.timeout_ms in src/config.js (6s), which leaves headroom
# under the 10s default.

# Headers live in public/_headers, generated by the build so the CSP hashes
# always match the file that shipped. Two sources of truth for headers is how
# you end up with a CSP that silently blocks your own page.
